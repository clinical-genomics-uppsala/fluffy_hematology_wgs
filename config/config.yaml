trimmer_software: "fastp_pe"

aligner: "bwa_gpu"

wp: "wp2"

annotate_cnv:
  cna_exons: "{{ref_hg38_cna_bed}}" 

arriba:
  assembly: "{{ref_homo_sapiens_grch38_dna_primary_assembly_fa}}"
  blacklist: "{{ref_blacklist_hg38_grch38_v2_5_1_tsv_gz}}"
  container: "{{CONTAINER_DIR}}/hydragenetics__arriba_2.5.1.sif"
  extra: "-p {{ref_protein_domains_hg38_grch38_v2_5_1_gff3}} -k {{ref_known_fusions_hg38_grch38_v2_5_1_tsv_gz}}"
  gtf: "{{ref_homo_sapiens_grch38_115_chr_gtf}}"

arriba_draw_fusion:
  container: "{{CONTAINER_DIR}}/hydragenetics__arriba_2.5.1.sif"
  cytobands: "{{ref_cytobands_hg38_grch38_v2_5_1_tsv}}"
  gtf: "{{ref_homo_sapiens_grch38_115_chr_gtf}}"
  protein_domains: "{{ref_protein_domains_hg38_grch38_v2_5_1_gff3}}"

bbduk:
  container: "{{CONTAINER_DIR}}/hydragenetics__bbduk_38.98.sif"
  fasta:
    - "{{ref_rfam_5_8s_database_id98_fasta}}"
    - "{{ref_rfam_5s_database_id98_fasta}}"
    - "{{ref_silva_bac_16s_id90_fasta}}"
    - "{{ref_silva_bac_23s_id98_fasta}}"
    - "{{ref_silva_euk_18s_id95_fasta}}"
    - "{{ref_silva_euk_28s_id98_fasta}}"
  kmer: "31"
  extra: "overwrite=t"

bcftools_SNV:
  all: "{{ref_all_snv_38_bed}}"
  aml: "{{ref_aml_snv_38_2022_02_25_bed}}"
  tm: "{{ref_twist_myeloid_coding_exons_added_regions_250904_bed}}"

bcftools_SV:
  all: "{{ref_all_sv_38_bed}}"
  aml: "{{ref_aml_sv_38_bed}}"

cnvkit_batch:
  container: "{{CONTAINER_DIR}}/hydragenetics__cnvkit_0.9.9.sif"
  method: "wgs"
  normal_reference: "{{ref_reference_normal_pool_wgs_250822_bin1000_cnn}}"
  extra: "--drop-low-coverage "

cnvkit_call:
  container: "{{CONTAINER_DIR}}/hydragenetics__cnvkit_0.9.9.sif"

cnvkit_diagram:
  container: "{{CONTAINER_DIR}}/hydragenetics__cnvkit_0.9.9.sif"

cnv_html_report:
  show_table: true
  template_dir: "{{FLUFFY_HOME}}/config/cnv_report_template"
  cnv_vcf:
    - annotation: cna_exons
      filter: cnv_hardfilter
  cytobands: True
  wide_plot_width: 2500

cnvkit_scatter:
  container: "{{CONTAINER_DIR}}/hydragenetics__cnvkit_0.9.9.sif"
  extra: "-c {locus} --y-min -5 --y-max 5"
  cna:
    "chr4": "DUX4"
    "chr5": "EBF1"
    "chr7": "IKZF1"
    "chr9": "CDKN2A,CDKN2B,PAX5"
    "chr11": "KMT2A"
    "chr12": "BTG1,ETV6,ZNF384"
    "chr13": "RB1"
    "chr17": "TP53"
    "chr21": "ERG,RUNX1"
    "chrX": "CRLF2,CSF2RA,IL3RA,P2RY8"

cnvkit_scatter_whole:
  container: "{{CONTAINER_DIR}}/hydragenetics__cnvkit_0.9.9.sif"
  extra: "--y-min -5 --y-max 5"

cnvkit_table:
  bedfile: "{{ref_cnvkit_table_bedfile_hg38_cna_bed}}"
  cyto_coordinates: "{{ref_genomicpos_cytogencoord_txt}}"

crumble:
  container: "{{CONTAINER_DIR}}/hydragenetics__crumble_0.8.3.sif"
  extra: "-O CRAM"

export_to_xlsx_rna_fusions:
