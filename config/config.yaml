# ---------------------------------------------------------------------------
#  Gemensam config (Marvin och Miarka).
#
#  Kors tillsammans med en site-config och en referensfil:
#    --configfile config/config.yaml \
#                 config/reference_files/reference_files_<site>.yaml \
#                 config/site_configs/site_config_<site>.yaml
#  {{ref_*}} loses ur reference_files_<site>.yaml, {{CONTAINER_DIR}} och
